function blankER()  { return Object.fromEntries(TRIAGE.er.map(t=>[t.key,{trauma:0,nontrauma:0}])); }
function blankEMS() { return Object.fromEntries(TRIAGE.ems.map(t=>[t.key,{trauma:0,nontrauma:0,als:0,bls:0,fr:0}])); }

let CU = null;

// ================================================
// LOCAL DRAFT SYNC (แทนที่ Firebase ด้วย LocalStorage)
// ================================================
function loadLocalData() {
  try {
    const p = localStorage.getItem('er_pats'); if(p) ST.patients = JSON.parse(p);
    const e = localStorage.getItem('er_evs'); if(e) ST.events = JSON.parse(e);
    const er = localStorage.getItem('er_draft_er'); if(er) ST.er = JSON.parse(er);
    const ems = localStorage.getItem('er_draft_ems'); if(ems) ST.ems = JSON.parse(ems);
    const stf = localStorage.getItem('er_staff'); if(stf) ST.staff = JSON.parse(stf);
    const hist = localStorage.getItem('er_hist'); if(hist) ST.history = JSON.parse(hist);
  } catch(e) { console.error(e); }
}

function saveDraft() {
  localStorage.setItem('er_draft_er', JSON.stringify(ST.er));
  localStorage.setItem('er_draft_ems', JSON.stringify(ST.ems));
}
function savePatsEvs() {
  localStorage.setItem('er_pats', JSON.stringify(ST.patients));
  localStorage.setItem('er_evs', JSON.stringify(ST.events));
}
function clearActive() {
  ST.er = blankER(); ST.ems = blankEMS(); ST.patients = []; ST.events = [];
  ['er_draft_er','er_draft_ems','er_pats','er_evs'].forEach(k => localStorage.removeItem(k));
}

// ================================================
// SHEETS HELPERS
// ================================================
const getUrl = () => localStorage.getItem('er_sheets_url')||'';
async function sheetsGET(action, p={}) {
  const url = getUrl(); if(!url) throw new Error('ยังไม่ตั้งค่า Sheets URL');
  const qs = new URLSearchParams({action,...p}).toString();
  const r = await fetch(`${url}?${qs}`); return r.json();
}
async function sheetsPOST(action, data={}) {
  const url = getUrl(); if(!url) return {ok:false,error:'no_url'};
  await fetch(url,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,...data})});
  return {ok:true};
}

// ================================================
// CUSTOM ALERTS
// ================================================
function showConfirm(message, title = 'ยืนยัน', icon = '⚠️', colorClass = 'bg-blue-600 hover:bg-blue-700') {
  return new Promise((resolve) => {
    const modal = document.getElementById('custom-alert-modal');
    document.getElementById('custom-alert-message').textContent = message;
    document.getElementById('custom-alert-title').textContent = title;
    document.getElementById('custom-alert-icon').textContent = icon;
    const okBtn = document.getElementById('custom-alert-ok');
    const cancelBtn = document.getElementById('custom-alert-cancel');
    cancelBtn.classList.remove('hidden');
    okBtn.className = `${colorClass} text-white px-5 py-2 rounded-xl font-black shadow transition-colors`;
    modal.classList.add('active');
    const onOk = () => { cleanup(); resolve(true); };
    const onCancel = () => { cleanup(); resolve(false); };
    const cleanup = () => { okBtn.removeEventListener('click', onOk); cancelBtn.removeEventListener('click', onCancel); modal.classList.remove('active'); };
    okBtn.addEventListener('click', onOk); cancelBtn.addEventListener('click', onCancel);
  });
}
function showAlert(message, title = 'แจ้งเตือน', icon = 'ℹ️', colorClass = 'bg-blue-600 hover:bg-blue-700') {
  return new Promise((resolve) => {
    const modal = document.getElementById('custom-alert-modal');
    document.getElementById('custom-alert-message').textContent = message;
    document.getElementById('custom-alert-title').textContent = title;
    document.getElementById('custom-alert-icon').textContent = icon;
    const okBtn = document.getElementById('custom-alert-ok');
    document.getElementById('custom-alert-cancel').classList.add('hidden');
    okBtn.className = `${colorClass} text-white px-5 py-2 rounded-xl font-black shadow transition-colors`;
    modal.classList.add('active');
    const onOk = () => { okBtn.removeEventListener('click', onOk); modal.classList.remove('active'); resolve(true); };
    okBtn.addEventListener('click', onOk);
  });
}

window.onload = async () => {
  document.getElementById('global-date').value = new Date().toISOString().split('T')[0];
  setInterval(()=>{ document.getElementById('live-clock').textContent = new Date().toLocaleTimeString('th-TH'); }, 1000);
  
  const url = getUrl();
  if (!url) document.getElementById('setup-banner').classList.remove('hidden');
  else {
    document.getElementById('sheets-url-input').value = url;
    SHEETS_OK = true; updateSheetsUI(true);
    try { const r = await sheetsGET('getUsers'); if(r.ok) cachedUsers = r.users||[]; } catch(e){}
  }
  loadLocalData();
};

async function doLogin() {
  const username = document.getElementById('login-username').value.trim();
  const password = document.getElementById('login-password').value.trim();
  const errEl = document.getElementById('login-error');
  const btn = document.getElementById('login-btn');
  if(!username||!password){ errEl.textContent='❌ กรุณากรอก username และรหัสผ่าน'; errEl.classList.remove('hidden'); return; }

  if(username.toLowerCase()==='admin' && password==='1234' && !SHEETS_OK) {
    startSession(EMERGENCY, true); return;
  }

  btn.innerHTML = '<span class="spinner"></span> กำลังตรวจสอบ...'; btn.disabled = true; errEl.classList.add('hidden');
  try {
    let user = null;
    if(SHEETS_OK) {
      const r = await sheetsGET('login',{username,password});
      if(r.ok && r.user) user = r.user; else throw new Error(r.error||'ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง');
    } else {
      const found = cachedUsers.find(u=>u.username.toLowerCase()===username.toLowerCase()&&String(u.password||'')===password&&u.active);
      if(found) user = found; else if(username.toLowerCase()==='admin'&&password==='1234') user = EMERGENCY; else throw new Error('ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง');
    }
    startSession(user, !SHEETS_OK);
  } catch(e) {
    errEl.textContent='❌ '+e.message; errEl.classList.remove('hidden'); btn.innerHTML='เข้าสู่ระบบ'; btn.disabled=false;
  }
}

function startSession(user, offline=false) {
  CU = user;
  document.getElementById('user-avatar').textContent = (user.username||'?').slice(0,2).toUpperCase();
  document.getElementById('user-fullname').textContent = user.fullname;
  document.getElementById('user-role-label').textContent = (user.role==='admin' ? '👑 Admin' : '👤 User') + (offline?' · offline':'');
  document.getElementById('sheets-dot').className = `w-1.5 h-1.5 rounded-full inline-block ${SHEETS_OK?'bg-green-400':'bg-amber-400'}`;
  
  document.getElementById('nav-admin').classList.toggle('hidden', user.role!=='admin');
  document.getElementById('btn-clear-history').classList.toggle('hidden', user.role!=='admin');
  
  document.getElementById('login-screen').classList.add('gone');
  document.getElementById('main-app').classList.remove('gone');
  document.getElementById('main-app').classList.add('flex');

  initStaffSelectors(); loadStaffSelectors();
  renderERTable(); renderEMSTable(); renderPatients(); renderEvents(); renderHistory();
  if(getUrl()) updateSheetsUI(true);
  switchTab('dashboard');
}

async function doLogout() {
  const isConfirm = await showConfirm('ต้องการออกจากระบบหรือไม่?', 'ออกจากระบบ', '🚪', 'bg-red-500 hover:bg-red-600');
  if(!isConfirm) return;
  CU = null;
  document.getElementById('login-screen').classList.remove('gone');
  document.getElementById('main-app').classList.add('gone');
  document.getElementById('main-app').classList.remove('flex');
  document.getElementById('login-username').value=''; document.getElementById('login-password').value='';
  document.getElementById('login-btn').innerHTML='เข้าสู่ระบบ'; document.getElementById('login-btn').disabled=false;
}

function switchTab(id){
  document.querySelectorAll('.tab-content').forEach(t=>t.classList.remove('active'));
  document.getElementById('tab-'+id).classList.add('active');
  document.querySelectorAll('.nav-btn').forEach(b=>{b.classList.remove('border-blue-600','text-blue-700','font-extrabold');b.classList.add('border-transparent','text-slate-500');});

// ================================================
// TABLES (ER & EMS)
// ================================================
function renderERTable(){
  const tb=document.getElementById('er-table-body'); tb.innerHTML=''; let tT=0,tN=0;
  TRIAGE.er.forEach(t=>{
    const d=ST.er[t.key] || {trauma: 0, nontrauma: 0};
    const row=tb.insertRow(); row.className='hover:bg-slate-50';
    row.innerHTML=`<td class="px-4 py-2"><span class="triage-tag ${t.cls}">${t.label}</span></td>
    <td class="px-1 py-2 text-center"><input type="number" min="0" value="${d.trauma}" class="table-input" onchange="setER('${t.key}','trauma',this.value)"></td>
    <td class="px-1 py-2 text-center"><input type="number" min="0" value="${d.nontrauma}" class="table-input" onchange="setER('${t.key}','nontrauma',this.value)"></td>
    <td class="px-4 py-2 text-right font-black text-slate-700 bg-slate-50 text-lg">${d.trauma+d.nontrauma}</td>`;
    if(t.key!=='admit'&&t.key!=='refer'){tT+=d.trauma;tN+=d.nontrauma;}
  });
  document.getElementById('er-foot-t').textContent=tT; document.getElementById('er-foot-n').textContent=tN; document.getElementById('er-foot-total').textContent=tT+tN;
  updateStats();
}
function setER(k,f,v){ ST.er[k][f]=parseInt(v)||0; renderERTable(); saveDraft(); }

function renderEMSTable(){
  const tb=document.getElementById('ems-table-body'); tb.innerHTML=''; let tT=0,tN=0,tA=0,tB=0,tF=0,tot=0;
  TRIAGE.ems.forEach(t=>{
    const d=ST.ems[t.key] || {trauma:0,nontrauma:0,als:0,bls:0,fr:0};
    const rt=Math.max(d.trauma+d.nontrauma,d.als+d.bls+d.fr);
    const row=tb.insertRow(); row.className='hover:bg-slate-50';
    row.innerHTML=`<td class="px-4 py-1.5 border-r border-slate-100"><span class="triage-tag ${t.cls}">${t.label}</span></td>
    <td class="px-1 py-1.5 text-center"><input type="number" min="0" value="${d.trauma}" class="table-input" onchange="setEMS('${t.key}','trauma',this.value)"></td>
    <td class="px-1 py-1.5 text-center"><input type="number" min="0" value="${d.nontrauma}" class="table-input" onchange="setEMS('${t.key}','nontrauma',this.value)"></td>
    <td class="px-1 py-1.5 text-center"><input type="number" min="0" value="${d.als}" class="table-input" onchange="setEMS('${t.key}','als',this.value)"></td>
    <td class="px-1 py-1.5 text-center"><input type="number" min="0" value="${d.bls}" class="table-input" onchange="setEMS('${t.key}','bls',this.value)"></td>
    <td class="px-1 py-1.5 text-center"><input type="number" min="0" value="${d.fr}" class="table-input" onchange="setEMS('${t.key}','fr',this.value)"></td>
    <td class="px-3 py-1.5 text-right font-black text-slate-700 bg-slate-50 text-lg">${rt}</td>`;
    if(!['death','notfound','refer','admit'].includes(t.key)){tT+=d.trauma;tN+=d.nontrauma;tA+=d.als;tB+=d.bls;tF+=d.fr;tot+=rt;}
  });
  ['t','n','als','bls','fr'].forEach((k,i)=>document.getElementById('ems-foot-'+k).textContent=[tT,tN,tA,tB,tF][i]);
  document.getElementById('ems-foot-total').textContent=tot;
  updateStats();
}
function setEMS(k,f,v){ ST.ems[k][f]=parseInt(v)||0; renderEMSTable(); saveDraft(); }

function updateStats(){
  let eR=0; TRIAGE.er.forEach(t=>{if(t.key!=='admit'&&t.key!=='refer')eR+=ST.er[t.key].trauma+ST.er[t.key].nontrauma;});
  let eE=0; TRIAGE.ems.forEach(t=>{if(!['death','notfound','refer','admit'].includes(t.key))eE+=Math.max(ST.ems[t.key].trauma+ST.ems[t.key].nontrauma,ST.ems[t.key].als+ST.ems[t.key].bls+ST.ems[t.key].fr);});
  document.getElementById('stat-er').textContent=eR; document.getElementById('stat-ems').textContent=eE;
  document.getElementById('stat-admit').textContent=ST.er.admit.trauma+ST.er.admit.nontrauma;
  document.getElementById('stat-refer').textContent=ST.er.refer.trauma+ST.er.refer.nontrauma;
}

// ================================================
let editingPid=null;
function openPatientModal(id=null){
  editingPid=id; document.getElementById('modal-title').textContent=id?'แก้ไขข้อมูลผู้ป่วย':'ข้อมูลผู้ป่วยส่งเวร';
  if(id){
    const p=ST.patients.find(x=>String(x.id)===String(id));
    if(p){ document.getElementById('form-hn').value=p.hn||''; document.getElementById('form-dx').value=p.dx||''; document.getElementById('form-status').value=p.status||'Pending'; document.getElementById('form-abnormal').value=p.abnormal||''; document.getElementById('form-todo').value=p.todo||''; document.getElementById('form-remark').value=p.remark||''; }
  } else {
    ['form-hn','form-dx','form-abnormal','form-todo','form-remark'].forEach(i=>document.getElementById(i).value=''); document.getElementById('form-status').value='Pending';
  }
  document.getElementById('patient-modal').classList.add('active');
}
function closePatientModal(){document.getElementById('patient-modal').classList.remove('active');editingPid=null;}

function savePatient(){
  const hn=document.getElementById('form-hn').value.trim(); const dx=document.getElementById('form-dx').value.trim();
  if(!hn||!dx){ showAlert('กรุณากรอก HN และ วินิจฉัยโรค', 'เตือน', '⚠️', 'bg-amber-500 hover:bg-amber-600'); return; }
  const id = editingPid ? String(editingPid) : String(Date.now());
  const d={ id, hn, dx, gender:document.getElementById('form-gender').value, status:document.getElementById('form-status').value, abnormal:document.getElementById('form-abnormal').value.trim(), todo:document.getElementById('form-todo').value.trim(), remark:document.getElementById('form-remark').value.trim(), ts:new Date().toLocaleString('th-TH') };
  if(editingPid){ const idx=ST.patients.findIndex(x=>String(x.id)===id); if(idx>-1) ST.patients[idx]=d; } else { ST.patients.unshift(d); }
  savePatsEvs(); renderPatients(); closePatientModal();
}
async function deletePatient(id){
  const isConfirm = await showConfirm('ลบข้อมูลผู้ป่วยนี้?', 'ยืนยัน', '🗑️', 'bg-red-600 hover:bg-red-700');
  if(!isConfirm) return;
  ST.patients = ST.patients.filter(x=>String(x.id)!==String(id));
  savePatsEvs(); renderPatients();
}
function renderPatients(){
  const tb=document.getElementById('patient-table-body');
  if(!ST.patients.length){tb.innerHTML='<tr><td colspan="7" class="py-12 text-center text-slate-400 font-bold italic">-- ยังไม่มีรายการ --</td></tr>';return;}
  const ss={Admit:'bg-indigo-100 text-indigo-800',Refer:'bg-orange-100 text-orange-800',Obs:'bg-emerald-100 text-emerald-800',Pending:'bg-amber-100 text-amber-800'};
  tb.innerHTML=ST.patients.map(p=>`<tr class="hover:bg-blue-50/40"><td class="px-4 py-3 font-black">${p.hn} (${p.gender})</td><td class="px-4 py-3"><span class="px-2 py-1 rounded-lg text-xs font-black ${ss[p.status]||ss.Pending}">${p.status}</span></td><td class="px-4 py-3 font-black text-xs">${p.dx}</td><td class="px-4 py-3 text-red-600 text-xs">${p.abnormal||'—'}</td><td class="px-4 py-3 text-blue-800 text-xs">${p.todo||'—'}</td><td class="px-4 py-3 text-red-600 font-black text-xs">${p.remark?'⚠️ '+p.remark:'—'}</td><td class="px-4 py-3 text-center"><button onclick="openPatientModal(${p.id})" class="text-blue-500 mx-1">✏️</button><button onclick="deletePatient(${p.id})" class="text-red-500 mx-1">🗑️</button></td></tr>`).join('');
}

let editingEvId = null;
function openEventModal(id=null) {
  editingEvId = id; document.getElementById('event-modal-title').textContent = id ? 'แก้ไขเหตุการณ์' : 'เพิ่มเหตุการณ์';
  if(id) { const ev = ST.events.find(x => String(x.id) === String(id)); if(ev) { document.getElementById('form-event-type').value=ev.type; document.getElementById('form-event-status').value=ev.status; document.getElementById('form-event-detail').value=ev.detail; } } 
  else { document.getElementById('form-event-detail').value = ''; }
  document.getElementById('event-modal').classList.add('active');
}
function closeEventModal() { document.getElementById('event-modal').classList.remove('active'); editingEvId = null; }
function saveEvent() {
  const detail = document.getElementById('form-event-detail').value.trim();
  if(!detail) { showAlert('กรุณากรอกรายละเอียด', 'เตือน', '⚠️', 'bg-amber-500'); return; }
  const id = editingEvId ? String(editingEvId) : String(Date.now());
  const d = { id, type:document.getElementById('form-event-type').value, status:document.getElementById('form-event-status').value, detail, ts: new Date().toLocaleString('th-TH'), by: CU?.fullname || '—' };
  if(editingEvId){ const idx=ST.events.findIndex(x=>String(x.id)===id); if(idx>-1) ST.events[idx]=d; } else { ST.events.unshift(d); }
  savePatsEvs(); renderEvents(); closeEventModal();
}
async function deleteEvent(id) {
  if(!(await showConfirm('ลบรายการนี้?', 'ยืนยัน', '🗑️', 'bg-red-600'))) return;
  ST.events = ST.events.filter(x=>String(x.id)!==String(id)); savePatsEvs(); renderEvents();
}
function toggleEventStatus(id) {
  const ev = ST.events.find(x => String(x.id) === String(id));
  if(ev) { ev.status = ev.status === 'OK' ? 'Pending' : 'OK'; savePatsEvs(); renderEvents(); }
}
function renderEvents() {
  const tb = document.getElementById('event-table-body');
  if(!ST.events.length) { tb.innerHTML = '<tr><td colspan="5" class="py-12 text-center text-slate-400 font-bold italic">-- ยังไม่มีบันทึกเหตุการณ์ --</td></tr>'; return; }
  const ss = { OK: 'bg-emerald-100 text-emerald-800', Pending: 'bg-amber-100 text-amber-800' };
  tb.innerHTML = ST.events.map(ev => `<tr><td class="px-4 py-3 font-black">${ev.type}</td><td class="px-4 py-3 text-center"><button onclick="toggleEventStatus(${ev.id})" class="px-2 py-1 rounded-lg text-xs font-black ${ss[ev.status]}">${ev.status==='OK'?'🟢 OK':'🟡 รอ'}</button></td><td class="px-4 py-3 font-bold text-sm">${ev.detail}</td><td class="px-4 py-3 text-xs text-slate-500">${ev.by}<br>${ev.ts}</td><td class="px-4 py-3 text-center"><button onclick="openEventModal(${ev.id})" class="text-blue-500 mx-1">✏️</button><button onclick="deleteEvent(${ev.id})" class="text-red-500 mx-1">🗑️</button></td></tr>`).join('');
}

function initStaffSelectors(){
  const opt=l=>'<option value="">— กรุณาเลือก —</option>'+l.map(n=>`<option value="${n}">${n}</option>`).join('');
  document.getElementById('s-doctor').innerHTML=opt(LISTS.doctors); document.getElementById('s-emt').innerHTML=opt(LISTS.emt); document.getElementById('s-super').innerHTML=opt(LISTS.supervise);
  document.querySelectorAll('.nurse-pool').forEach(s=>s.innerHTML=opt(LISTS.nurses));
  document.querySelectorAll('.na-pool').forEach(s=>s.innerHTML=opt(LISTS.na));
  document.querySelectorAll('.refer-pool').forEach(s=>s.innerHTML=opt(LISTS.refer));
}
function loadStaffSelectors(){
  const s=ST.staff; const set=(id,v)=>{const e=document.getElementById(id);if(e&&v)e.value=v;};
  set('s-doctor',s.doctor); set('s-head',s.head); set('s-m1',s.m1); set('s-m2',s.m2); set('s-m3',s.m3); set('s-emt',s.emt); set('s-na',s.na); set('s-ref1',s.ref1); set('s-ref2',s.ref2); set('s-super',s.supervise);
  ['head','m1','m2','m3','emt','na','na_ref'].forEach(k=>{const e=document.getElementById('s-'+k+'-other');if(e&&s[k+'_other'])e.value=s[k+'_other'];}); renderStaffSummary();
}
function saveStaff(){
  const gv=id=>{const e=document.getElementById(id);return e?e.value:'';};
  ST.staff={doctor:gv('s-doctor'),head:gv('s-head'),head_other:gv('s-head-other'),m1:gv('s-m1'),m1_other:gv('s-m1-other'),m2:gv('s-m2'),m2_other:gv('s-m2-other'),m3:gv('s-m3'),m3_other:gv('s-m3-other'),emt:gv('s-emt'),emt_other:gv('s-emt-other'),na:gv('s-na'),na_other:gv('s-na-other'),ref1:gv('s-ref1'),ref2:gv('s-ref2'),na_ref:gv('s-na-ref'),na_ref_other:gv('s-na-ref-other'),supervise:gv('s-super')};
  localStorage.setItem('er_staff', JSON.stringify(ST.staff));
  const btn=document.querySelector('#tab-staff button'); btn.textContent='✅ บันทึกแล้ว!'; btn.classList.replace('bg-slate-900','bg-emerald-700'); setTimeout(()=>{btn.textContent='✅ ยืนยันและบันทึกข้อมูล'; btn.classList.replace('bg-emerald-700','bg-slate-900');},2000);
  renderStaffSummary();
}
function renderStaffSummary(){
  const s=ST.staff; const n=(a,b)=>{const sv=s[a]||'';const ov=s[b]||'';return sv&&ov?sv+', '+ov:sv||ov||'';};
  const rows=[{icon:'🩺',label:'แพทย์',value:s.doctor||''},{icon:'👩‍⚕️',label:'หน.เวร',value:n('head','head_other')},{icon:'💊',label:'M1',value:n('m1','m1_other')},{icon:'🚑',label:'EMT',value:n('emt','emt_other')},{icon:'🤝',label:'NA',value:n('na','na_other')},{icon:'🔁',label:'Refer',value:s.ref1||''}].filter(r=>r.value);
  const cont=document.getElementById('staff-summary-content');
  if(!rows.length){cont.innerHTML='<p class="text-center py-4 text-slate-400">— ไม่มีข้อมูล —</p>';return;}
  cont.innerHTML=`<div class="grid grid-cols-2 md:grid-cols-3 gap-3">${rows.map(r=>`<div class="bg-slate-50 border rounded-xl p-3"><span class="text-xs font-black text-slate-400">${r.icon} ${r.label}</span><div class="font-bold text-sm">${r.value}</div></div>`).join('')}</div>`;
}

// ================================================
// SAVE SHIFT (ส่งยอดเข้า Sheets & ล้างกระดาน)
// ================================================
async function saveCurrentShift(){
  const date=document.getElementById('global-date').value; const shift=document.getElementById('global-shift').value; const ts=new Date().toLocaleString('th-TH');
  const s=ST.staff; const jn=(a,b)=>[s[a],s[b]].filter(Boolean).join(', ');
  const staffDisplay=[s.doctor&&`แพทย์: ${s.doctor}`,(s.head||s.head_other)&&`หัวหน้าเวร: ${jn('head','head_other')}`,(s.m1||s.m1_other)&&`Member: ${jn('m1','m1_other')}`].filter(Boolean);
  
  const entryId = Date.now();
  const entry={ id: entryId, date, shift, shiftLabel:shift, ts, loggedByFullname:CU?.fullname||'', stats:{er:document.getElementById('stat-er').textContent,ems:document.getElementById('stat-ems').textContent,admit:document.getElementById('stat-admit').textContent,refer:document.getElementById('stat-refer').textContent}, staffDisplay, patients:JSON.parse(JSON.stringify(ST.patients)), events:JSON.parse(JSON.stringify(ST.events||[])), erData:JSON.parse(JSON.stringify(ST.er)), emsData:JSON.parse(JSON.stringify(ST.ems)) };

  const btn=document.querySelector('#tab-dashboard button[onclick="saveCurrentShift()"]'); const orig=btn.innerHTML;
  btn.disabled=true; btn.innerHTML='⏳ กำลังส่งข้อมูลเข้า Sheets...'; btn.classList.replace('bg-blue-800','bg-slate-600');

  try {
    ST.history.unshift(entry); localStorage.setItem('er_hist', JSON.stringify(ST.history));
    
    if(SHEETS_OK){
      const base={date,shift,timestamp:ts,loggedByFullname:CU?.fullname};
      const erRows=TRIAGE.er.map(t=>({label:t.label,trauma:ST.er[t.key].trauma,nontrauma:ST.er[t.key].nontrauma,total:ST.er[t.key].trauma+ST.er[t.key].nontrauma}));
      const emsRows=TRIAGE.ems.map(t=>{const d=ST.ems[t.key];return{label:t.label,trauma:d.trauma,nontrauma:d.nontrauma,als:d.als,bls:d.bls,fr:d.fr,total:Math.max(d.trauma+d.nontrauma,d.als+d.bls+d.fr)};});
      const patRows=ST.patients.map(p=>({hn:p.hn,gender:p.gender,status:p.status,dx:p.dx,abnormal:p.abnormal,todo:p.todo,remark:p.remark}));
      await Promise.all([sheetsPOST('writeERData',{...base,rows:erRows}), sheetsPOST('writeEMSData',{...base,rows:emsRows}), sheetsPOST('writePatientData',{...base,rows:patRows}), sheetsPOST('writeHistory',{...base,...entry})]);
    }
    
    clearActive();
    btn.disabled=false; btn.innerHTML='✅ บันทึกเรียบร้อย!'; btn.classList.replace('bg-slate-600','bg-emerald-700');
    setTimeout(()=>{btn.innerHTML=orig;btn.classList.replace('bg-emerald-700','bg-blue-800'); resetDash(); switchTab('history');}, 1500);
  } catch(e) {
    btn.disabled=false; btn.innerHTML=orig; btn.classList.replace('bg-slate-600','bg-blue-800');
    showAlert('เซฟล้มเหลว: '+e.message, 'ผิดพลาด', '❌', 'bg-red-600');
  }
}

function resetDash(){
  const shift=document.getElementById('global-shift').value;
  if(shift==='เวรดึก'){ const d=new Date(document.getElementById('global-date').value); d.setDate(d.getDate()+1); document.getElementById('global-date').value=d.toISOString().split('T')[0]; }
  const so=['เวรเช้า','เวรบ่าย','เวรดึก']; document.getElementById('global-shift').value=so[(so.indexOf(shift)+1)%3];
  renderERTable(); renderEMSTable(); renderPatients(); renderEvents(); renderHistory();
}

function renderHistory(){
  const cont=document.getElementById('history-container'); if(!cont) return;
  if(!ST.history.length){cont.innerHTML='<div class="col-span-full text-center py-10 text-slate-400 font-bold">ยังไม่พบประวัติ</div>';return;}
  cont.innerHTML=ST.history.map(h=>`<div class="bg-white border rounded-xl p-4 shadow-sm mb-4"><div class="flex justify-between border-b pb-2 mb-2"><h4 class="font-black text-blue-700">${h.shiftLabel||h.shift} (${h.date})</h4><span class="text-xs text-slate-400">${h.ts}</span></div><div class="grid grid-cols-4 gap-2 text-center text-sm font-bold"><div class="bg-blue-50 rounded p-1">ER: ${h.stats.er}</div><div class="bg-green-50 rounded p-1">EMS: ${h.stats.ems}</div><div class="bg-indigo-50 rounded p-1">ADM: ${h.stats.admit}</div><div class="bg-orange-50 rounded p-1">REF: ${h.stats.refer}</div></div><div class="mt-2 text-xs text-slate-500">บันทึกโดย: ${h.loggedByFullname}</div></div>`).join('');
}
